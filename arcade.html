<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sweet Arcade — 3D</title><style>
@import url('https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800;900&display=swap');*{box-sizing:border-box}body{margin:0;font-family:Nunito,system-ui;background:#f8eefa;color:#795e82;overflow:hidden}#world{position:fixed;inset:0}canvas{display:block;touch-action:none}header{position:fixed;top:0;left:0;right:0;z-index:4;display:flex;justify-content:space-between;align-items:center;padding:15px 22px;pointer-events:none}header>*{pointer-events:auto}a{color:#ae7eae;text-decoration:none;font-weight:900}.counter{border-radius:17px;background:#fffcfff0;padding:11px 16px;font-weight:900;box-shadow:0 6px 24px #d5b6d155}.panel{position:fixed;z-index:5;top:50%;left:50%;transform:translate(-50%,-50%);width:min(410px,calc(100vw - 28px));padding:30px;border:2px solid white;border-radius:28px;background:#fffafdee;text-align:center;box-shadow:0 22px 75px #bba3c56e;backdrop-filter:blur(12px)}h1{font-size:39px;line-height:1.1;color:#ae7dab;margin:8px 0}p{font-size:14px;line-height:1.6}.tag{font-size:11px;letter-spacing:2px;color:#d38cb3;font-weight:900}button{font:900 15px Nunito,system-ui;border:0;border-radius:14px;background:linear-gradient(100deg,#f0a2c2,#bda7ed);color:white;padding:13px 23px;cursor:pointer;touch-action:manipulation}button.alt{background:#f0e8f6;color:#98769b}.hidden{display:none!important}#controls{position:fixed;z-index:3;bottom:27px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:9px;max-width:100vw}#controls button{min-width:53px;font-size:20px;padding:12px 14px;touch-action:none}#controls #action{font-size:13px;min-width:116px}#hint{position:fixed;z-index:3;bottom:100px;left:50%;transform:translateX(-50%);white-space:nowrap;border-radius:13px;padding:9px 13px;background:#fffcffdd;font-size:12px;font-weight:900}.small{font-size:12px;color:#b294b3}.stars{font-size:25px}@media(max-width:550px){header{padding:12px}header a{font-size:13px}.counter{font-size:12px}.panel{padding:23px}#controls{bottom:20px;gap:5px}#controls button{min-width:43px;padding:11px}#hint{bottom:89px;font-size:11px}}</style></head><body><div id="world"></div><header><a href="index.html">← sweet arcade ♡</a><span class="counter" id="counter">Уровень 1</span></header><div id="hint" class="hidden"></div><section id="intro" class="panel"><div class="tag">PASTEL 3D ADVENTURE</div><h1 id="title"></h1><p id="description"></p><button id="start">Начать игру ✦</button><p class="small">Рекорд: <b id="record">0</b></p></section><section id="result" class="panel hidden"><div class="stars">✧ ♡ ✧</div><h1 id="resultTitle"></h1><p id="resultText"></p><button id="next">Дальше ✦</button><button class="alt" id="home">В меню</button></section><section id="pausePanel" class="panel hidden"><h1>Пауза ☁</h1><button id="resume">Продолжить</button><button class="alt" id="homePause">В меню</button></section><div id="controls" class="hidden"><button data-key="left">◀</button><button data-key="up">▲</button><button data-key="down">▼</button><button data-key="right">▶</button><button id="action">Действие ♡</button><button id="pause">Ⅱ</button></div><script type="module" src="arcade.js"></script></body></html>
